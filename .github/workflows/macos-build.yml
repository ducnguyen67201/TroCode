name: macOS build and release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to build
        required: true
        type: string
        default: main
      require_signing:
        description: Fail unless Apple signing and notarization secrets are configured
        required: true
        type: boolean
        default: false
      publish_release:
        description: Upload both macOS ZIPs to an existing matching GitHub Release
        required: true
        type: boolean
        default: false
      release_tag:
        description: Existing release tag to receive the ZIPs when publishing
        required: false
        type: string
      allow_unsigned_preview:
        description: Acknowledge Gatekeeper warnings when publishing an unsigned preview
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      signing_enabled: ${{ steps.release.outputs.signing_enabled }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      unsigned_preview: ${{ steps.release.outputs.unsigned_preview }}
      version: ${{ steps.release.outputs.version }}
    env:
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}

      - name: Validate source, credentials, and release target
        id: release
        env:
          ALLOW_UNSIGNED_PREVIEW: ${{ inputs.allow_unsigned_preview }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REQUIRE_SIGNING: ${{ inputs.require_signing }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$DOPPLER_TOKEN" ]]; then
            echo '::error::Missing required repository secret: DOPPLER_TOKEN'
            exit 1
          fi

          signing_names=(
            APPLE_API_ISSUER
            APPLE_API_KEY_ID
            APPLE_API_KEY_P8_BASE64
            MACOS_CERTIFICATE_P12_BASE64
            MACOS_CERTIFICATE_PASSWORD
            MACOS_SIGNING_IDENTITY
          )
          configured=0
          for name in "${signing_names[@]}"; do
            if [[ -n "${!name}" ]]; then
              configured=$((configured + 1))
            fi
          done

          if (( configured != 0 && configured != ${#signing_names[@]} )); then
            echo '::error::Configure all six Apple signing/notarization secrets, or none of them.'
            exit 1
          fi

          signing_enabled=false
          if (( configured == ${#signing_names[@]} )); then
            signing_enabled=true
          fi
          if [[ "$REQUIRE_SIGNING" == 'true' && "$signing_enabled" != 'true' ]]; then
            echo '::error::This run requires Apple signing and notarization credentials.'
            exit 1
          fi

          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json contains an invalid release version: $version"
            exit 1
          fi

          source_sha="$(git rev-parse HEAD)"
          unsigned_preview=false
          if [[ "$PUBLISH_RELEASE" == 'true' ]]; then
            if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
              echo '::error::Published macOS artifacts must be dispatched from main.'
              exit 1
            fi
            if [[ -z "$RELEASE_TAG" ]]; then
              echo '::error::release_tag is required when publish_release is enabled.'
              exit 1
            fi
            if [[ "$RELEASE_TAG" != "v$version" && "$RELEASE_TAG" != "v$version-"* && "$RELEASE_TAG" != "v$version+"* ]]; then
              echo "::error::Release tag $RELEASE_TAG does not match package version $version."
              exit 1
            fi

            release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease)" || {
              echo "::error::GitHub Release $RELEASE_TAG does not exist. Create the shared desktop release first."
              exit 1
            }
            tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ -z "$tag_sha" || "$tag_sha" != "$source_sha" ]]; then
              echo "::error::source_ref must resolve to the same commit as $RELEASE_TAG."
              exit 1
            fi

            if [[ "$signing_enabled" != 'true' ]]; then
              if [[ "$ALLOW_UNSIGNED_PREVIEW" != 'true' ]]; then
                echo '::error::Unsigned publishing requires allow_unsigned_preview.'
                exit 1
              fi
              if [[ "$(jq -r '.isPrerelease' <<<"$release_json")" != 'true' ]]; then
                echo '::error::Unsigned macOS artifacts can be uploaded only to a prerelease.'
                exit 1
              fi
              unsigned_preview=true
            fi
          fi

          echo "signing_enabled=$signing_enabled" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "unsigned_preview=$unsigned_preview" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    env:
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dopplerhq/cli-action@v4

      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run check

      - name: Configure Apple signing and notarization
        if: needs.validate.outputs.signing_enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/trocode-signing.p12"
          api_key_path="$RUNNER_TEMP/trocode-notary-key.p8"
          keychain_path="$RUNNER_TEMP/trocode-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"

          echo "TROCODE_MACOS_SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "TROCODE_APPLE_API_KEY=$api_key_path" >> "$GITHUB_ENV"
          echo "TROCODE_APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "TROCODE_APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          echo "TROCODE_MACOS_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Build macOS ZIP
        shell: bash
        run: |
          set -euo pipefail
          doppler run \
            --preserve-env="TROCODE_MACOS_SIGNING_IDENTITY,TROCODE_APPLE_API_KEY,TROCODE_APPLE_API_KEY_ID,TROCODE_APPLE_API_ISSUER" \
            --project tro-app \
            --config prd \
            -- npm exec -- electron-forge make --arch=${{ matrix.architecture }}

      - name: Verify ZIP and write SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          artifact_directory="out/make/zip/darwin/${{ matrix.architecture }}"
          zip_path="$artifact_directory/Tro-darwin-${{ matrix.architecture }}-${{ needs.validate.outputs.version }}.zip"
          if [[ ! -f "$zip_path" ]]; then
            echo "::error::macOS ZIP not found in $artifact_directory"
            exit 1
          fi

          verify_directory="$RUNNER_TEMP/trocode-verify-${{ matrix.architecture }}"
          mkdir -p "$verify_directory"
          ditto -x -k "$zip_path" "$verify_directory"
          app_path="$(find "$verify_directory" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo '::error::The macOS ZIP does not contain an application bundle.'
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"

          if [[ '${{ needs.validate.outputs.signing_enabled }}' == 'true' ]]; then
            spctl --assess --type execute --verbose=2 "$app_path"
          fi

          checksum_path="$artifact_directory/SHA256SUMS-macos-${{ matrix.architecture }}.txt"
          checksum="$(shasum -a 256 "$zip_path" | awk '{print $1}')"
          printf '%s  %s\n' "$checksum" "$(basename "$zip_path")" > "$checksum_path"

          {
            echo '### macOS ${{ matrix.architecture }} build'
            echo '- Signed and notarized: ${{ needs.validate.outputs.signing_enabled }}'
            echo "- ZIP: $(basename "$zip_path")"
            echo '- Source: `${{ needs.validate.outputs.source_sha }}`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload macOS ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Tro-macOS-${{ matrix.architecture }}-${{ github.run_number }}
          path: |
            out/make/zip/darwin/${{ matrix.architecture }}/*.zip
            out/make/zip/darwin/${{ matrix.architecture }}/SHA256SUMS-macos-${{ matrix.architecture }}.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing credentials
        if: always() && needs.validate.outputs.signing_enabled == 'true'
        shell: bash
        run: |
          security delete-keychain "$TROCODE_MACOS_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/trocode-signing.p12" "$RUNNER_TEMP/trocode-notary-key.p8"

  publish:
    if: inputs.publish_release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download macOS release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Tro-macOS-*-${{ github.run_number }}
          path: release-assets
          merge-multiple: true

      - name: Upload macOS assets to the shared GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zip_assets < <(find release-assets -maxdepth 1 -type f -name '*.zip' -print | sort)
          mapfile -t checksum_assets < <(find release-assets -maxdepth 1 -type f -name 'SHA256SUMS-macos-*.txt' -print | sort)
          if (( ${#zip_assets[@]} != 2 || ${#checksum_assets[@]} != 2 )); then
            echo '::error::Expected two macOS ZIPs and two checksum files.'
            exit 1
          fi

          gh release upload "$RELEASE_TAG" \
            "${zip_assets[@]}" \
            "${checksum_assets[@]}" \
            --repo "$GITHUB_REPOSITORY"

          {
            echo '### macOS release upload'
            echo "- Release: **$RELEASE_TAG**"
            echo '- Architectures: arm64 and x64'
            echo '- Signed and notarized: ${{ needs.validate.outputs.signing_enabled }}'
            echo '- Unsigned preview: ${{ needs.validate.outputs.unsigned_preview }}'
          } >> "$GITHUB_STEP_SUMMARY"
