name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dopplerhq/cli-action@v4
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run check
      - run: npm run package
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
