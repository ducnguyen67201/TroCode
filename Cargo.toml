[workspace]
resolver = "2"
members = [
  "apps/tro-admin",
  "apps/tro-api",
  "apps/tro-migrate",
  "apps/tro-worker",
  "crates/tro-agent",
  "crates/tro-contracts",
  "crates/tro-cua",
  "crates/tro-desktop-core",
  "crates/tro-domain",
  "crates/tro-knowledge",
  "crates/tro-migration",
  "crates/tro-persistence",
  "crates/tro-providers",
  "src-tauri",
]

[workspace.package]
version = "0.1.6"
edition = "2024"
rust-version = "1.95.0"
authors = ["Duc Ng <danielbaker06072001@gmail.com>"]
license = "MIT"
repository = "https://github.com/ducnguyen67201/TroCode"

[workspace.dependencies]
anyhow = "=1.0.104"
aes-gcm = "=0.10.3"
async-trait = "=0.1.89"
aws-config = { version = "=1.8.12", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
aws-sdk-s3 = "=1.142.0"
axum = { version = "=0.8.9", features = ["http1", "http2", "json", "macros", "multipart", "tokio"] }
base64 = "=0.22.1"
bytes = "=1.12.1"
cua-driver-sdk = { git = "https://github.com/trycua/cua.git", rev = "a1672e7b11951275ecfba3384264d4530185d0db", package = "cua-driver-sdk" }
clap = { version = "=4.5.53", features = ["derive", "env"] }
ed25519-dalek = { version = "=2.2.0", features = ["pkcs8", "rand_core"] }
futures-util = "=0.3.34"
hmac = "=0.12.1"
http = "=1.4.0"
http-body-util = "=0.1.3"
jsonwebtoken = { version = "=10.2.0", default-features = false, features = ["aws_lc_rs"] }
keyring = "=4.1.6"
lopdf = "=0.44.0"
mime = "=0.3.17"
rand = "=0.9.2"
reqwest = { version = "=0.13.4", default-features = false, features = ["form", "json", "multipart", "rustls", "stream"] }
schemars = { version = "=1.2.2", features = ["uuid1"] }
sea-orm = { version = "=2.0.2", features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "with-json", "with-time", "with-uuid"] }
sea-orm-migration = { version = "=2.0.2", features = ["runtime-tokio-rustls", "sqlx-postgres"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
subtle = "=2.6.1"
thiserror = "=2.0.20"
time = { version = "=0.3.55", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "=1.53.0", features = ["full"] }
tokio-util = "=0.7.19"
tower = { version = "=0.5.2", features = ["limit", "timeout", "util"] }
tower-http = { version = "=0.7.0", features = ["catch-panic", "cors", "limit", "request-id", "sensitive-headers", "set-header", "timeout", "trace"] }
tauri = { version = "=2.11.5", features = ["macos-private-api", "tray-icon"] }
tauri-build = "=2.6.3"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-process = "=2.3.1"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-stronghold = "=2.3.1"
tauri-plugin-updater = "=2.10.1"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json"] }
url = "=2.5.7"
uuid = { version = "=1.24.1", features = ["serde", "v4"] }

tro-agent = { path = "crates/tro-agent" }
tro-contracts = { path = "crates/tro-contracts" }
tro-cua = { path = "crates/tro-cua" }
tro-desktop-core = { path = "crates/tro-desktop-core" }
tro-domain = { path = "crates/tro-domain" }
tro-knowledge = { path = "crates/tro-knowledge" }
tro-migration = { path = "crates/tro-migration" }
tro-persistence = { path = "crates/tro-persistence" }
tro-providers = { path = "crates/tro-providers" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
await_holding_lock = "deny"
dbg_macro = "deny"
expect_used = "deny"
print_stderr = "deny"
print_stdout = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
